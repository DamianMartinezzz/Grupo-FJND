            <div class="content">
                <h1 class="title is-1">Crear Clase</h1>
                <p class="subtitle mt-4">Completá los datos para dar de alta una nueva clase.</p>

                <form id="form-crear-clase">
                    <div class="field">
                        <label class="label">Nombre</label>
                        <div class="control">
                            <input class="input" type="text" id="nombre" placeholder="Ej: Spinning" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Profesor</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="id_profesor" required>
                                    <option value="">Cargando profesores...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Descripción</label>
                        <div class="control">
                            <textarea class="textarea" id="descripcion" placeholder="Descripción opcional de la clase"></textarea>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Día de la semana</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="dia_semana">
                                    <option value="">Seleccioná un día</option>
                                    <option value="Lunes">Lunes</option>
                                    <option value="Martes">Martes</option>
                                    <option value="Miércoles">Miércoles</option>
                                    <option value="Jueves">Jueves</option>
                                    <option value="Viernes">Viernes</option>
                                    <option value="Sábado">Sábado</option>
                                    <option value="Domingo">Domingo</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field is-grouped">
                        <div class="control is-expanded">
                            <label class="label">Hora de inicio</label>
                            <input class="input" type="time" id="hora_inicio">
                        </div>
                        <div class="control is-expanded">
                            <label class="label">Hora de fin</label>
                            <input class="input" type="time" id="hora_fin">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Cupo Máximo</label>
                        <div class="control">
                            <input class="input" type="number" id="cupo_maximo" min="1" placeholder="Ej: 20">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Estado</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="estado">
                                    <option value="Activa">Activa</option>
                                    <option value="Inactiva">Inactiva</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field is-grouped mt-5">
                        <div class="control">
                            <button type="submit" class="button is-primary">Crear Clase</button>
                        </div>
                        <div class="control">
                            <a href="clases.html" class="button is-light">Cancelar</a>
                        </div>
                    </div>
                </form>

                <div id="mensaje" class="mt-4"></div>
            </div>
        </div>

        <script>
            const API_CLASES = "http://localhost:3000/api/clases";
            const API_PROFESORES = "http://localhost:3000/api/profesores";

            async function cargarProfesores() {
                const select = document.getElementById("id_profesor");

                try {
                    const response = await fetch(API_PROFESORES);
                    const profesores = await response.json();

                    if (!profesores.length) {
                        select.innerHTML = `<option value="">No hay profesores registrados</option>`;
                        return;
                    }

                    select.innerHTML = `<option value="">Seleccioná un profesor</option>` +
                        profesores.map(p => `<option value="${p.id_profesor}">${p.nombre} ${p.apellido}</option>`).join("");

                } catch (error) {
                    select.innerHTML = `<option value="">Error al cargar profesores</option>`;
                }
            }

            document.getElementById("form-crear-clase").addEventListener("submit", async (e) => {
                e.preventDefault();

                const mensajeDiv = document.getElementById("mensaje");
                mensajeDiv.innerHTML = "";

                const nuevaClase = {
                    id_profesor: document.getElementById("id_profesor").value,
                    nombre: document.getElementById("nombre").value,
                    descripcion: document.getElementById("descripcion").value || null,
                    dia_semana: document.getElementById("dia_semana").value || null,
                    hora_inicio: document.getElementById("hora_inicio").value || null,
                    hora_fin: document.getElementById("hora_fin").value || null,
                    cupo_maximo: document.getElementById("cupo_maximo").value || null,
                    estado: document.getElementById("estado").value
                };

                try {
                    const response = await fetch(API_CLASES, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(nuevaClase)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => null);
                        throw new Error(errorData?.error || `Error ${response.status}`);
                    }

                    mensajeDiv.innerHTML = `<div class="notification is-success">Clase creada con éxito. Volviendo al listado... <a href="clases.html">Volver ahora</a></div>`;
                    document.getElementById("form-crear-clase").reset();

                    setTimeout(() => {
                        window.location.href = "clases.html";
                    }, 1500);

                } catch (error) {
                    mensajeDiv.innerHTML = `<div class="notification is-danger">Error al crear la clase: ${error.message}</div>`;
                }
            });

            cargarProfesores();
        </script>
    </body>
