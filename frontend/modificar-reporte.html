            <div class="content">
                <h1 class="title is-1">Modificar Reportes</h1>
                <p class="subtitle mt-4">Actualizá los datos del reporte seleccionado.</p>

                <div id="mensaje-carga"></div>

                <div id="buscador-manual" style="display: none;" class="box">
                    <div class="field has-addons">
                        <div class="control is-expanded">
                            <input class="input" type="number" id="input-id-manual" placeholder="Ingresá el ID del socio">
                        </div>
                        <div class="control">
                            <button id="btn-buscar" class="button is-info">Buscar</button>
                        </div>
                    </div>
                </div>

                <form id="form-modificar-reporte" style="display: none;">
                    <div class="field">
                        <label class="label">Id Rutina</label>
                        <div class="control">
                            <input class="input" type="number" id="id_rutina" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Id Socio</label>
                        <div class="control">
                            <input class="input" type="number" id="id_socio" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Día</label>
                        <div class="control">
                            <input class="input" type="number" id="dia" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Fecha de Asistencia</label>
                        <div class="control">
                            <input class="input" type="date" id="fecha_asistencia">
                        </div>
                    </div>

                    <div class="field is-grouped mt-5">
                        <div class="control">
                            <button type="submit" class="button is-warning">Guardar Cambios</button>
                        </div>
                        <div class="control">
                            <a href="reportes.html" class="button is-light">Cancelar</a>
                        </div>
                    </div>
                </form>

                <div id="mensaje" class="mt-4"></div>
            </div>
        </div>

        <script>
            const params = new URLSearchParams(window.location.search);
            let idReporte = params.get("id");

            const mensajeCargaDiv = document.getElementById("mensaje-carga");
            const buscadorManualDiv = document.getElementById("buscador-manual");
            const form = document.getElementById("form-modificar-reporte");
            const mensajeDiv = document.getElementById("mensaje");

            async function cargarReporte(id) {
                mensajeCargaDiv.innerHTML = "";
                form.style.display = "none";

                try {
                    const response = await fetch(`http://localhost:3000/api/reportes/${id}`);

                    if (!response.ok) {
                        throw new Error("Reporte no encontrado");
                    }

                    const reporte = await response.json();

                    document.getElementById("id_rutina").value = reporte.id_rutina;
                    document.getElementById("id_socio").value = reporte.id_socio;
                    document.getElementById("dia").value = reporte.dia;
                    document.getElementById("fecha_asistencia").value = reporte.fecha_asistencia;

                    idReporte = id;
                    form.style.display = "block";

                } catch (error) {
                    mensajeCargaDiv.innerHTML = `<div class="notification is-danger">Error al cargar el reporte: ${error.message}</div>`;
                }
            }

            document.getElementById("btn-buscar").addEventListener("click", () => {
                const idIngresado = document.getElementById("input-id-manual").value;
                if (idIngresado) {
                    cargarReporte(idIngresado);
                }
            });

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                mensajeDiv.innerHTML = "";

                const reporteActualizado = {
                    id_rutina: document.getElementById("id_rutina").value,
                    id_socio: document.getElementById("id_socio").value,
                    dia: document.getElementById("dia").value,
                    fecha_asistencia: document.getElementById("fecha_asistencia").value,
                };

                try {
                    const response = await fetch(`http://localhost:3000/api/reportes/${idReporte}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(reporteActualizado)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => null);
                        throw new Error(errorData?.error || `Error ${response.status}`);
                    }

                    mensajeDiv.innerHTML = `<div class="notification is-success">Reporte actualizado con éxito. Volviendo al listado... <a href="reportes.html">Volver ahora</a></div>`;

                    setTimeout(() => {
                        window.location.href = "reportes.html";
                    }, 1500);

                } catch (error) {
                    mensajeDiv.innerHTML = `<div class="notification is-danger">Error al actualizar el reporte: ${error.message}</div>`;
                }
            });

            if (idReporte) {
                cargarReporte(idReporte);
            } else {
                buscadorManualDiv.style.display = "block";
            }
        </script>
    </body>
