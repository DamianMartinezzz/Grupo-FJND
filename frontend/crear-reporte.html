            <div class="content">
                <h1 class="title is-1">Crear Reporte</h1>
                <p class="subtitle mt-4">Completá los datos para registrar un nuevo reporte en el sistema.</p>

                <form id="form-crear-reporte">
                    <div class="field">
                        <label class="label">Id Rutina</label>
                        <div class="control">
                            <input class="input" type="number" id="id_rutina" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Id Socio</label>
                        <div class="control">
                            <input class="input" type="number" id="id_socio" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Día</label>
                        <div class="control">
                            <input class="input" type="number" id="dia" required>
                        </div>
                    </div>

                   
                    <div class="field">
                        <label class="label">Fecha Asistencia</label>
                        <div class="control">
                            <input class="input" type="date" id="fecha_asistencia">
                        </div>
                    </div>

                    <div class="field is-grouped mt-5">
                        <div class="control">
                            <button type="submit" class="button is-primary">Crear Reporte</button>
                        </div>
                        <div class="control">
                            <a href="reportes.html" class="button is-light">Cancelar</a>
                        </div>
                    </div>
                </form>

                <div id="mensaje" class="mt-4"></div>
            </div>
        </div>

        <script>
            const API_URL = "http://localhost:3000/api/reportes";

            document.getElementById("form-crear-reporte").addEventListener("submit", async (e) => {
                e.preventDefault();

                const mensajeDiv = document.getElementById("mensaje");
                mensajeDiv.innerHTML = "";

                const nuevoReporte = {
                    id_rutina: document.getElementById("id_rutina").value,
                    id_socio: document.getElementById("id_socio").value,
                    dia: document.getElementById("dia").value,
                    fecha_asistencia: document.getElementById("fecha_asistencia").value,
                };

                try {
                    const response = await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(nuevoReporte)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => null);
                        throw new Error(errorData?.error || `Error ${response.status}`);
                    }

                    mensajeDiv.innerHTML = `<div class="notification is-success">Reporte creado con éxito. Redirigiendo...</div>`;
                    
                    // Redirige automáticamente a la lista de reportes después de 1 segundo y medio
                    setTimeout(() => {
                        window.location.href = "reportes.html";
                    }, 1500);

                } catch (error) {
                    mensajeDiv.innerHTML = `<div class="notification is-danger">Error al crear el reporte: ${error.message}</div>`;
                }
            });
        </script>
