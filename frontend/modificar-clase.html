            <div class="content">
                <h1 class="title is-1">Modificar Clase</h1>
                <p class="subtitle mt-4">Actualizá los datos de la clase seleccionada.</p>

                <div id="mensaje-carga"></div>

                <form id="form-modificar-clase" style="display: none;">
                    <div class="field">
                        <label class="label">Nombre</label>
                        <div class="control">
                            <input class="input" type="text" id="nombre" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Profesor</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="id_profesor" required>
                                    <option value="">Cargando profesores...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Descripción</label>
                        <div class="control">
                            <textarea class="textarea" id="descripcion"></textarea>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Día de la semana</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="dia_semana">
                                    <option value="">Seleccioná un día</option>
                                    <option value="Lunes">Lunes</option>
                                    <option value="Martes">Martes</option>
                                    <option value="Miércoles">Miércoles</option>
                                    <option value="Jueves">Jueves</option>
                                    <option value="Viernes">Viernes</option>
                                    <option value="Sábado">Sábado</option>
                                    <option value="Domingo">Domingo</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field is-grouped">
                        <div class="control is-expanded">
                            <label class="label">Hora de inicio</label>
                            <input class="input" type="time" id="hora_inicio">
                        </div>
                        <div class="control is-expanded">
                            <label class="label">Hora de fin</label>
                            <input class="input" type="time" id="hora_fin">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Cupo Máximo</label>
                        <div class="control">
                            <input class="input" type="number" id="cupo_maximo" min="1">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Estado</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="estado">
                                    <option value="Activa">Activa</option>
                                    <option value="Inactiva">Inactiva</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field is-grouped mt-5">
                        <div class="control">
                            <button type="submit" class="button is-warning">Guardar Cambios</button>
                        </div>
                        <div class="control">
                            <a href="clases.html" class="button is-light">Cancelar</a>
                        </div>
                    </div>
                </form>

                <div id="mensaje" class="mt-4"></div>
            </div>
        </div>

        <script>
            const params = new URLSearchParams(window.location.search);
            const idClase = params.get("id");
            const API_CLASES = "http://localhost:3000/api/clases";
            const API_PROFESORES = "http://localhost:3000/api/profesores";
            const API_URL = `${API_CLASES}/${idClase}`;

            const mensajeCargaDiv = document.getElementById("mensaje-carga");
            const form = document.getElementById("form-modificar-clase");
            const mensajeDiv = document.getElementById("mensaje");

            async function cargarProfesores(idProfesorActual) {
                const select = document.getElementById("id_profesor");

                try {
                    const response = await fetch(API_PROFESORES);
                    const profesores = await response.json();

                    select.innerHTML = profesores.map(p =>
                        `<option value="${p.id_profesor}" ${p.id_profesor == idProfesorActual ? "selected" : ""}>${p.nombre} ${p.apellido}</option>`
                    ).join("");

                } catch (error) {
                    select.innerHTML = `<option value="">Error al cargar profesores</option>`;
                }
            }

            async function cargarClase() {
                if (!idClase) {
                    mensajeCargaDiv.innerHTML = `<div class="notification is-danger">No se especificó qué clase modificar.</div>`;
                    return;
                }

                try {
                    const response = await fetch(API_URL);

                    if (!response.ok) {
                        throw new Error("Clase no encontrada");
                    }

                    const clase = await response.json();

                    document.getElementById("nombre").value = clase.nombre;
                    document.getElementById("descripcion").value = clase.descripcion ?? "";
                    document.getElementById("dia_semana").value = clase.dia_semana ?? "";
                    document.getElementById("hora_inicio").value = clase.hora_inicio ? clase.hora_inicio.substring(0, 5) : "";
                    document.getElementById("hora_fin").value = clase.hora_fin ? clase.hora_fin.substring(0, 5) : "";
                    document.getElementById("cupo_maximo").value = clase.cupo_maximo ?? "";
                    document.getElementById("estado").value = clase.estado ?? "Activa";

                    await cargarProfesores(clase.id_profesor);

                    form.style.display = "block";

                } catch (error) {
                    mensajeCargaDiv.innerHTML = `<div class="notification is-danger">Error al cargar la clase: ${error.message}</div>`;
                }
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                mensajeDiv.innerHTML = "";

                const claseActualizada = {
                    id_profesor: document.getElementById("id_profesor").value,
                    nombre: document.getElementById("nombre").value,
                    descripcion: document.getElementById("descripcion").value || null,
                    dia_semana: document.getElementById("dia_semana").value || null,
                    hora_inicio: document.getElementById("hora_inicio").value || null,
                    hora_fin: document.getElementById("hora_fin").value || null,
                    cupo_maximo: document.getElementById("cupo_maximo").value || null,
                    estado: document.getElementById("estado").value
                };

                try {
                    const response = await fetch(API_URL, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(claseActualizada)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => null);
                        throw new Error(errorData?.error || `Error ${response.status}`);
                    }

                    mensajeDiv.innerHTML = `<div class="notification is-success">Clase actualizada con éxito. Volviendo al listado... <a href="clases.html">Volver ahora</a></div>`;

                    setTimeout(() => {
                        window.location.href = "clases.html";
                    }, 1500);

                } catch (error) {
                    mensajeDiv.innerHTML = `<div class="notification is-danger">Error al actualizar la clase: ${error.message}</div>`;
                }
            });

            cargarClase();
        </script>
    </body>
