            <div class="container mt-5" style="max-width: 500px;">
                <div class="box has-text-centered">
                    <h1 class="title is-3 has-text-danger">Eliminar Detalle</h1>
                    <p class="subtitle is-6 mt-3">¿Estás seguro de que deseas eliminar este registro del sistema?</p>
                    
                    <div class="buttons is-centered mt-5">
                        <button id="btnEliminar" class="button is-danger">Sí, Eliminar</button>
                        <a href="detalle-reporte.html" class="button is-light">Cancelar</a>
                    </div>
                </div>

                <script>
                    const API_DETALLE = "http://localhost:3000/api/detalle-reporte";
                    const urlParams = new URLSearchParams(window.location.search);
                    const idDetalle = urlParams.get('id');

                    document.getElementById('btnEliminar').addEventListener('click', async () => {
                        if (!idDetalle) {
                            alert('No se encontró un ID válido');
                            return;
                        }

                        try {
                            const response = await fetch(`${API_DETALLE}/${idDetalle}`, {
                                method: 'DELETE'
                            });
                            const result = await response.json();
                            if (response.ok) {
                                alert('Detalle eliminado correctamente');
                                window.location.href = 'detalle-reporte.html';
                            } else {
                                alert('Error: ' + (result.error || 'No se pudo eliminar'));
                            }
                        } catch (error) {
                            alert('Error de red al intentar eliminar');
                        }
                    });
                </script>
            </div>
        </div>
