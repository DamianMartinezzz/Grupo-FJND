            <div class="content">
                <h1 class="title is-1">Modificar Socio</h1>
                <p class="subtitle mt-4">Actualizá los datos del socio seleccionado.</p>

                <div id="mensaje-carga"></div>

                <div id="buscador-manual" style="display: none;" class="box">
                    <div class="field has-addons">
                        <div class="control is-expanded">
                            <input class="input" type="number" id="input-id-manual" placeholder="Ingresá el ID del socio">
                        </div>
                        <div class="control">
                            <button id="btn-buscar" class="button is-info">Buscar</button>
                        </div>
                    </div>
                </div>

                <form id="form-modificar-socio" style="display: none;">
                    <div class="field">
                        <label class="label">Nombre</label>
                        <div class="control">
                            <input class="input" type="text" id="nombre" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Apellido</label>
                        <div class="control">
                            <input class="input" type="text" id="apellido" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">DNI</label>
                        <div class="control">
                            <input class="input" type="text" id="dni" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Teléfono</label>
                        <div class="control">
                            <input class="input" type="text" id="telefono" placeholder="10 dígitos, sin espacios" pattern="[0-9]{10}" maxlength="10" required>
                        </div>
                        <p class="help">Debe tener exactamente 10 dígitos numéricos</p>
                    </div>

                    <div class="field">
                        <label class="label">Mail</label>
                        <div class="control">
                            <input class="input" type="email" id="mail" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Fecha de Nacimiento</label>
                        <div class="control">
                            <input class="input" type="date" id="fecha_nacimiento" min="1920-01-01" max="2020-12-31">
                        </div>
                    </div>

                    <div class="field is-grouped mt-5">
                        <div class="control">
                            <button type="submit" class="button is-warning">Guardar Cambios</button>
                        </div>
                        <div class="control">
                            <a href="socios.html" class="button is-light">Cancelar</a>
                        </div>
                    </div>
                </form>

                <div id="mensaje" class="mt-4"></div>
            </div>
        </div>

        <script>
            const params = new URLSearchParams(window.location.search);
            let idSocio = params.get("id");

            const mensajeCargaDiv = document.getElementById("mensaje-carga");
            const buscadorManualDiv = document.getElementById("buscador-manual");
            const form = document.getElementById("form-modificar-socio");
            const mensajeDiv = document.getElementById("mensaje");

            async function cargarSocio(id) {
                mensajeCargaDiv.innerHTML = "";
                form.style.display = "none";

                try {
                    const response = await fetch(`http://localhost:3000/api/socios/${id}`);

                    if (!response.ok) {
                        throw new Error("Socio no encontrado");
                    }

                    const socio = await response.json();

                    document.getElementById("nombre").value = socio.nombre;
                    document.getElementById("apellido").value = socio.apellido;
                    document.getElementById("dni").value = socio.dni;
                    document.getElementById("telefono").value = socio.telefono;
                    document.getElementById("mail").value = socio.mail;
                    if (socio.fecha_nacimiento) {
                        document.getElementById("fecha_nacimiento").value = socio.fecha_nacimiento.split("T")[0];
                    }

                    idSocio = id;
                    form.style.display = "block";

                } catch (error) {
                    mensajeCargaDiv.innerHTML = `<div class="notification is-danger">Error al cargar el socio: ${error.message}</div>`;
                }
            }

            document.getElementById("btn-buscar").addEventListener("click", () => {
                const idIngresado = document.getElementById("input-id-manual").value;
                if (idIngresado) {
                    cargarSocio(idIngresado);
                }
            });

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                mensajeDiv.innerHTML = "";

                const socioActualizado = {
                    nombre: document.getElementById("nombre").value,
                    apellido: document.getElementById("apellido").value,
                    dni: document.getElementById("dni").value,
                    telefono: document.getElementById("telefono").value,
                    mail: document.getElementById("mail").value,
                    fecha_nacimiento: document.getElementById("fecha_nacimiento").value || null
                };

                try {
                    const response = await fetch(`http://localhost:3000/api/socios/${idSocio}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(socioActualizado)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => null);
                        throw new Error(errorData?.error || `Error ${response.status}`);
                    }

                    mensajeDiv.innerHTML = `<div class="notification is-success">Socio actualizado con éxito. Volviendo al listado... <a href="socios.html">Volver ahora</a></div>`;

                    setTimeout(() => {
                        window.location.href = "socios.html";
                    }, 1500);

                } catch (error) {
                    mensajeDiv.innerHTML = `<div class="notification is-danger">Error al actualizar el socio: ${error.message}</div>`;
                }
            });

            if (idSocio) {
                cargarSocio(idSocio);
            } else {
                buscadorManualDiv.style.display = "block";
            }
        </script>
    </body>
