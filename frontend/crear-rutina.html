            <div class="container mt-5">
                <h1 class="title is-1">Crear Rutina</h1>
                <p class="subtitle mt-3">Armá una nueva rutina de entrenamiento para un socio.</p>

                <form id="form-crear-rutina">
                    <div class="field">
                        <label class="label">Nombre</label>
                        <div class="control">
                            <input class="input" type="text" id="nombre" placeholder="Ej: Rutina Fuerza Inicial" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Socio</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="id_socio" required>
                                    <option value="">Cargando socios...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Profesor</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="id_profesor" required>
                                    <option value="">Cargando profesores...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field is-grouped">
                        <div class="control is-expanded">
                            <label class="label">Fecha de Inicio</label>
                            <input class="input" type="date" id="fecha_inicio">
                        </div>
                        <div class="control is-expanded">
                            <label class="label">Fecha de Fin</label>
                            <input class="input" type="date" id="fecha_fin">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Estado</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="estado">
                                    <option value="Activa">Activa</option>
                                    <option value="Inactiva">Inactiva</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field is-grouped mt-5">
                        <div class="control">
                            <button type="submit" class="button is-primary">Crear Rutina</button>
                        </div>
                        <div class="control">
                            <a href="armar-rutina.html" class="button is-light">Cancelar</a>
                        </div>
                    </div>
                </form>

                <div id="mensaje" class="mt-4"></div>
            </div>
        </div>

        <script>
            const API_RUTINAS = "http://localhost:3000/api/rutinas";
            const API_SOCIOS = "http://localhost:3000/api/socios";
            const API_PROFESORES = "http://localhost:3000/api/profesores";

            async function cargarSocios() {
                const select = document.getElementById("id_socio");
                const response = await fetch(API_SOCIOS);
                const socios = await response.json();

                select.innerHTML = `<option value="">Seleccioná un socio</option>` +
                    socios.map(s => `<option value="${s.id_socio}">${s.nombre} ${s.apellido}</option>`).join("");
            }

            async function cargarProfesores() {
                const select = document.getElementById("id_profesor");
                const response = await fetch(API_PROFESORES);
                const profesores = await response.json();

                select.innerHTML = `<option value="">Seleccioná un profesor</option>` +
                    profesores.map(p => `<option value="${p.id_profesor}">${p.nombre} ${p.apellido}</option>`).join("");
            }

            document.getElementById("form-crear-rutina").addEventListener("submit", async (e) => {
                e.preventDefault();

                const mensajeDiv = document.getElementById("mensaje");
                mensajeDiv.innerHTML = "";

                const nuevaRutina = {
                    id_socio: document.getElementById("id_socio").value,
                    id_profesor: document.getElementById("id_profesor").value,
                    nombre: document.getElementById("nombre").value,
                    fecha_inicio: document.getElementById("fecha_inicio").value || null,
                    fecha_fin: document.getElementById("fecha_fin").value || null,
                    fecha_modificacion: new Date().toISOString().split("T")[0],
                    estado: document.getElementById("estado").value
                };

                try {
                    const response = await fetch(API_RUTINAS, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(nuevaRutina)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => null);
                        throw new Error(errorData?.error || `Error ${response.status}`);
                    }

                    mensajeDiv.innerHTML = `<div class="notification is-success">Rutina creada con éxito. Volviendo al listado... <a href="armar-rutina.html">Volver ahora</a></div>`;
                    document.getElementById("form-crear-rutina").reset();

                    setTimeout(() => {
                        window.location.href = "armar-rutina.html";
                    }, 1500);

                } catch (error) {
                    mensajeDiv.innerHTML = `<div class="notification is-danger">Error al crear la rutina: ${error.message}</div>`;
                }
            });

            cargarSocios();
            cargarProfesores();
        </script>
    </body>
