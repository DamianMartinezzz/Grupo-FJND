            <div class="container mt-5">
                <h1 class="title is-1">Modificar Ejercicio</h1>
                <p class="subtitle mt-3">Actualizá los datos del ejercicio seleccionado.</p>

                <div class="columns is-centered mt-5">
                    <div class="column is-half">
                        <div id="mensaje" class="notification is-hidden"></div>
                        
                        <div class="card">
                            <div class="card-content">
                                <form id="form-modificar-ejercicio">
                                    <div class="field">
                                        <label class="label">Nombre del Ejercicio *</label>
                                        <div class="control">
                                            <input class="input" type="text" id="nombre" required>
                                        </div>
                                    </div>

                                    <div class="field">
                                        <label class="label">Grupo Muscular</label>
                                        <div class="control">
                                            <input class="input" type="text" id="grupo_muscular">
                                        </div>
                                    </div>

                                    <div class="field">
                                        <label class="label">Descripción</label>
                                        <div class="control">
                                            <textarea class="textarea" id="descripcion"></textarea>
                                        </div>
                                    </div>

                                    <div class="field is-grouped mt-5">
                                        <div class="control">
                                            <button type="submit" class="button is-warning">Actualizar</button>
                                        </div>
                                        <div class="control">
                                            <a href="ejercicios.html" class="button is-light">Cancelar</a>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <script>
                    const params = new URLSearchParams(window.location.search);
                    const idEjercicio = params.get("id");
                    const API_URL = `http://localhost:3000/api/ejercicios/${idEjercicio}`;
                    
                    const form = document.getElementById("form-modificar-ejercicio");
                    const mensaje = document.getElementById("mensaje");

                    async function cargarDatos() {
                        try {
                            const response = await fetch(API_URL);
                            if (!response.ok) throw new Error("Ejercicio no encontrado");
                            
                            const data = await response.json();
                            document.getElementById("nombre").value = data.nombre;
                            document.getElementById("grupo_muscular").value = data.grupo_muscular || "";
                            document.getElementById("descripcion").value = data.descripcion || "";
                        } catch (error) {
                            mostrarMensaje(error.message, "is-danger");
                            document.querySelector(".card").style.display = "none";
                        }
                    }

                    form.addEventListener("submit", async (e) => {
                        e.preventDefault();
                        
                        const ejercicioActualizado = {
                            nombre: document.getElementById("nombre").value,
                            grupo_muscular: document.getElementById("grupo_muscular").value,
                            descripcion: document.getElementById("descripcion").value
                        };

                        try {
                            const response = await fetch(API_URL, {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(ejercicioActualizado)
                            });

                            if (response.ok) {
                                window.location.href = "ejercicios.html";
                            } else {
                                const errorData = await response.json();
                                mostrarMensaje(errorData.error, "is-danger");
                            }
                        } catch (error) {
                            mostrarMensaje("Error de conexión con el servidor", "is-danger");
                        }
                    });

                    function mostrarMensaje(texto, clase) {
                        mensaje.textContent = texto;
                        mensaje.className = `notification ${clase}`;
                        mensaje.classList.remove("is-hidden");
                    }

                    if (idEjercicio) {
                        cargarDatos();
                    } else {
                        mostrarMensaje("No se especificó un ID válido", "is-danger");
                        document.querySelector(".card").style.display = "none";
                    }
                </script>
            </div>
        </div>
