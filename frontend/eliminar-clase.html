            <div class="content">
                <h1 class="title is-1">Eliminar Clase</h1>
                <p class="subtitle mt-4">Esta acción no se puede deshacer.</p>

                <div id="mensaje-carga"></div>

                <div id="confirmacion" style="display: none;">
                    <div class="notification is-warning">
                        <p>¿Estás seguro que querés eliminar la clase <strong id="nombre-clase"></strong>?</p>
                    </div>

                    <div class="field is-grouped">
                        <div class="control">
                            <button id="btn-confirmar" class="button is-danger">Sí, eliminar</button>
                        </div>
                        <div class="control">
                            <a href="clases.html" class="button is-light">Cancelar</a>
                        </div>
                    </div>
                </div>

                <div id="mensaje" class="mt-4"></div>
            </div>
        </div>

        <script>
            const params = new URLSearchParams(window.location.search);
            const idClase = params.get("id");
            const API_URL = `http://localhost:3000/api/clases/${idClase}`;

            const mensajeCargaDiv = document.getElementById("mensaje-carga");
            const confirmacionDiv = document.getElementById("confirmacion");
            const mensajeDiv = document.getElementById("mensaje");
            const nombreClaseEl = document.getElementById("nombre-clase");

            async function cargarClase() {
                if (!idClase) {
                    mensajeCargaDiv.innerHTML = `<div class="notification is-danger">No se especificó qué clase eliminar.</div>`;
                    return;
                }

                try {
                    const response = await fetch(API_URL);

                    if (!response.ok) {
                        throw new Error("Clase no encontrada");
                    }

                    const clase = await response.json();
                    nombreClaseEl.textContent = clase.nombre;
                    confirmacionDiv.style.display = "block";

                } catch (error) {
                    mensajeCargaDiv.innerHTML = `<div class="notification is-danger">Error al cargar la clase: ${error.message}</div>`;
                }
            }

            document.getElementById("btn-confirmar").addEventListener("click", async () => {
                mensajeDiv.innerHTML = "";

                try {
                    const response = await fetch(API_URL, { method: "DELETE" });
                    const data = await response.json().catch(() => null);

                    if (!response.ok) {
                        throw new Error(data?.error || `Error ${response.status}`);
                    }

                    confirmacionDiv.style.display = "none";
                    mensajeDiv.innerHTML = `<div class="notification is-success">Clase eliminada con éxito. <a href="clases.html">Volver al listado</a></div>`;

                } catch (error) {
                    mensajeDiv.innerHTML = `<div class="notification is-danger">${error.message}</div>`;
                }
            });

            cargarClase();
        </script>
