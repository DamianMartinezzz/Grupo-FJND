            <div class="container mt-5">
                <h1 class="title is-1">Modificar Rutina</h1>
                <p class="subtitle mt-3">Actualizá los datos de la rutina seleccionada.</p>

                <div id="mensaje-carga"></div>

                <form id="form-modificar-rutina" style="display: none;">
                    <div class="field">
                        <label class="label">Nombre</label>
                        <div class="control">
                            <input class="input" type="text" id="nombre" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Socio</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="id_socio" required>
                                    <option value="">Cargando socios...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Profesor</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="id_profesor" required>
                                    <option value="">Cargando profesores...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field is-grouped">
                        <div class="control is-expanded">
                            <label class="label">Fecha de Inicio</label>
                            <input class="input" type="date" id="fecha_inicio">
                        </div>
                        <div class="control is-expanded">
                            <label class="label">Fecha de Fin</label>
                            <input class="input" type="date" id="fecha_fin">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Estado</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="estado">
                                    <option value="Activa">Activa</option>
                                    <option value="Inactiva">Inactiva</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field is-grouped mt-5">
                        <div class="control">
                            <button type="submit" class="button is-warning">Guardar Cambios</button>
                        </div>
                        <div class="control">
                            <a href="armar-rutina.html" class="button is-light">Cancelar</a>
                        </div>
                    </div>
                </form>

                <div id="mensaje" class="mt-4"></div>
            </div>
        </div>

        <script>
            const params = new URLSearchParams(window.location.search);
            const idRutina = params.get("id");
            const API_RUTINAS = "http://localhost:3000/api/rutinas";
            const API_SOCIOS = "http://localhost:3000/api/socios";
            const API_PROFESORES = "http://localhost:3000/api/profesores";
            const API_URL = `${API_RUTINAS}/${idRutina}`;

            const mensajeCargaDiv = document.getElementById("mensaje-carga");
            const form = document.getElementById("form-modificar-rutina");
            const mensajeDiv = document.getElementById("mensaje");

            async function cargarSelects(idSocioActual, idProfesorActual) {
                const [sociosRes, profesoresRes] = await Promise.all([
                    fetch(API_SOCIOS),
                    fetch(API_PROFESORES)
                ]);
                const socios = await sociosRes.json();
                const profesores = await profesoresRes.json();

                const selectSocio = document.getElementById("id_socio");
                selectSocio.innerHTML = socios.map(s =>
                    `<option value="${s.id_socio}" ${s.id_socio == idSocioActual ? "selected" : ""}>${s.nombre} ${s.apellido}</option>`
                ).join("");

                const selectProfesor = document.getElementById("id_profesor");
                selectProfesor.innerHTML = profesores.map(p =>
                    `<option value="${p.idprofesor}" ${p.idprofesor == idProfesorActual ? "selected" : ""}>${p.nombre} ${p.apellido}</option>`
                ).join("");
            }

            async function cargarRutina() {
                if (!idRutina) {
                    mensajeCargaDiv.innerHTML = `<div class="notification is-danger">No se especificó qué rutina modificar.</div>`;
                    return;
                }

                try {
                    const response = await fetch(API_URL);

                    if (!response.ok) {
                        throw new Error("Rutina no encontrada");
                    }

                    const rutina = await response.json();

                    document.getElementById("nombre").value = rutina.nombre;
                    document.getElementById("fecha_inicio").value = rutina.fecha_inicio ? rutina.fecha_inicio.split("T")[0] : "";
                    document.getElementById("fecha_fin").value = rutina.fecha_fin ? rutina.fecha_fin.split("T")[0] : "";
                    document.getElementById("estado").value = rutina.estado ?? "Activa";

                    await cargarSelects(rutina.id_socio, rutina.id_profesor);

                    form.style.display = "block";

                } catch (error) {
                    mensajeCargaDiv.innerHTML = `<div class="notification is-danger">Error al cargar la rutina: ${error.message}</div>`;
                }
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                mensajeDiv.innerHTML = "";

                const rutinaActualizada = {
                    id_socio: document.getElementById("id_socio").value,
                    id_profesor: document.getElementById("id_profesor").value,
                    nombre: document.getElementById("nombre").value,
                    fecha_inicio: document.getElementById("fecha_inicio").value || null,
                    fecha_fin: document.getElementById("fecha_fin").value || null,
                    fecha_modificacion: new Date().toISOString().split("T")[0],
                    estado: document.getElementById("estado").value
                };

                try {
                    const response = await fetch(API_URL, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(rutinaActualizada)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => null);
                        throw new Error(errorData?.error || `Error ${response.status}`);
                    }

                    mensajeDiv.innerHTML = `<div class="notification is-success">Rutina actualizada con éxito. Volviendo al listado... <a href="armar-rutina.html">Volver ahora</a></div>`;

                    setTimeout(() => {
                        window.location.href = "armar-rutina.html";
                    }, 1500);

                } catch (error) {
                    mensajeDiv.innerHTML = `<div class="notification is-danger">Error al actualizar la rutina: ${error.message}</div>`;
                }
            });

            cargarRutina();
        </script>
    </body>
