services:
  postgres:
    container_name: gimnasio

    image: postgres:17

    ports:
      - "5432:5432"

    volumes:
      - ./.volumes/postgres/data:/var/lib/postgresql/data
      - ./app/db:/docker-entrypoint-initdb.d

    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: gimnasio